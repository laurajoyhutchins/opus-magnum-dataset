name: publish

on:
  workflow_dispatch:
    inputs:
      collection:
        description: Frozen collection ID to publish
        required: true
        default: base-game-2026-06-16
      input_path:
        description: Canonical release input directory
        required: true
        default: fixtures/tiny-corpus
      payload_policy:
        description: Payload policy
        required: true
        type: choice
        options:
          - metadata-only
          - include-permitted
        default: metadata-only

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run opus-corpus collections validate
      - name: Build and validate release
        env:
          RELEASE_COLLECTION: ${{ inputs.collection }}
          RELEASE_INPUT_PATH: ${{ inputs.input_path }}
          RELEASE_PAYLOAD_POLICY: ${{ inputs.payload_policy }}
        run: |
          uv run opus-corpus release build "$RELEASE_COLLECTION" --input "$RELEASE_INPUT_PATH" --output .publish-release --payload-policy "$RELEASE_PAYLOAD_POLICY"
          uv run opus-corpus release validate "$RELEASE_COLLECTION" --output .publish-release
      - name: Publish generated projection
        env:
          RELEASE_COLLECTION: ${{ inputs.collection }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run opus-corpus release publish "$RELEASE_COLLECTION" --output .publish-release
