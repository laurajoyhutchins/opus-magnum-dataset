name: restack-pr39-on-pr42

on:
  push:
    branches:
      - fix/transactional-release-publication

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge fail-closed validation base and resolve release boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/fail-closed-config-filesystem-37

          set +e
          git merge --no-ff --no-commit origin/fix/fail-closed-config-filesystem-37
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ "$unresolved" != "src/opus_corpus/release.py" ]; then
              echo "unexpected merge conflicts: $unresolved" >&2
              exit 1
            fi
          fi

          git show origin/fix/fail-closed-config-filesystem-37:src/opus_corpus/release.py > /tmp/release.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/release.py')
          text = path.read_text()
          text = text.replace(
              'from .config import CorpusConfig\n',
              'from .config import CorpusConfig\nfrom .directory_publication import publish_directory\n',
              1,
          )
          start = text.index('def build_release(')
          end = text.index('\n\ndef _ensure_supported_manifest_format', start)
          replacement = '''def build_release(
              collection: CollectionDefinition,
              input_dir: Path,
              output_dir: Path,
              config: CorpusConfig,
              payload_policy: str,
              coverage_policy: str = "complete",
          ) -> ReleaseManifest:
              loaded = load_release_inputs(input_dir)
              for config_name, rows in loaded.records.items():
                  validate_payload_policy(config_name, rows, payload_policy)
              validate_referential_integrity(loaded.records)

              collection_errors: list[ValidationError] = []
              for config_name in ("puzzles", "solutions"):
                  for index, row in enumerate(loaded.records[config_name], start=1):
                      if row.get("collection_id") != collection.collection_id:
                          collection_errors.append(
                              ValidationError(
                                  "collection_mismatch",
                                  f"row collection_id {row.get('collection_id')!r} != "
                                  f"{collection.collection_id!r}",
                                  config_name,
                                  index,
                              )
                          )
              if collection_errors:
                  raise ReleaseValidationError(collection_errors)

              release_metadata, release_metadata_sha256 = _load_release_metadata(input_dir)
              release_metadata = derive_release_metadata(
                  collection,
                  loaded.records,
                  release_metadata,
                  coverage_policy=coverage_policy,
              )
              output_dir = Path(output_dir)
              split = split_for_collection(collection.collection_id)

              with publish_directory(output_dir) as candidate:
                  config_results: dict[str, ConfigRelease] = {}
                  for config_name in CONFIG_NAMES:
                      rows = loaded.records[config_name]
                      parquet_rel = (
                          Path("data") / config_name / f"{split}-00000-of-00001.parquet"
                      )
                      parquet_path = candidate / parquet_rel
                      write_parquet(config_name, rows, parquet_path, config)
                      schema_resource = load_schema_resource(SCHEMA_FILES[config_name])
                      source = loaded.sources[config_name]
                      config_results[config_name] = ConfigRelease(
                          schema_path=schema_resource.logical_path,
                          schema_sha256=schema_resource.sha256,
                          records_sha256=canonical_records_sha256(rows),
                          row_count=len(rows),
                          parquet_path=parquet_rel.as_posix(),
                          parquet_sha256=_sha256_release_file(
                              parquet_path,
                              code="parquet_read_error",
                          ),
                          source_path=source["path"],
                          source_sha256=source["sha256"],
                      )

                  manifest = ReleaseManifest(
                      format_version=RELEASE_MANIFEST_FORMAT_VERSION,
                      corpus_schema_version=release_metadata["corpus_schema_version"],
                      collection_id=collection.collection_id,
                      collection_inventory_sha256=collection.inventory_sha256,
                      split=split,
                      build_software_revision=detect_git_revision(config.root),
                      build_config_sha256=_sha256_release_file(
                          config.path,
                          code="build_config_read_error",
                      ),
                      payload_policy=payload_policy,
                      coverage_policy=coverage_policy,
                      release_metadata=release_metadata,
                      release_metadata_sha256=release_metadata_sha256,
                      configs=config_results,
                      logical_release_sha256="",
                  ).with_logical_hash()
                  manifest_path = candidate / "release-manifest.json"
                  temp_path = candidate / ".release-manifest.json.tmp"
                  temp_path.write_text(
                      json.dumps(manifest.to_dict(), indent=2, sort_keys=True) + "\\n",
                      encoding="utf-8",
                  )
                  temp_path.replace(manifest_path)
                  validate_release(collection, candidate, config)

              return manifest
          '''
          # The triple-quoted source is indented by the workflow's Python block.
          import textwrap
          replacement = textwrap.dedent(replacement)
          path.write_text(text[:start] + replacement + text[end:])
          PY

          cp /tmp/release.py src/opus_corpus/release.py
          git add src/opus_corpus/release.py
          git rm .github/workflows/restack-pr39-on-pr42.yml
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "unresolved merge conflicts remain: $unresolved" >&2
            exit 1
          fi

          uv sync --locked --all-extras
          uv run ruff check .
          uv run pytest -q
          uv run pytest -q -o addopts= -m upstream
          uv run opus-corpus collections validate
          rm -rf .tmp-release .tmp-stage
          uv run opus-corpus release build base-game-2026-06-16 --input fixtures/tiny-corpus --output .tmp-release --payload-policy metadata-only --coverage-policy subset
          uv run opus-corpus release validate base-game-2026-06-16 --output .tmp-release
          uv run opus-corpus release stage base-game-2026-06-16 --output .tmp-release --destination .tmp-stage
          rm -rf .tmp-release .tmp-stage

          git add -A
          git commit -m "merge: stack transactional publication on fail-closed validation"
          git push origin HEAD:fix/transactional-release-publication
