[project]
name = "opus-magnum-corpus"
version = "0.1.0"
description = "Deterministic Opus Magnum corpus build and Hugging Face publication tooling"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub==1.16.1",
  "jsonschema==4.26.0",
  "pyarrow==21.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.12.12",
]

[project.scripts]
opus-corpus = "opus_corpus.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opus_corpus"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "opus_corpus/schemas"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
